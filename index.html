<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Schriftliche Division – Gitter</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI";
      background: #f3f4f6;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 2rem 2.5rem;
      max-width: 520px;
      width: 100%;
      box-sizing: border-box;
    }
    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 1.4rem;
    }
    .subtitle {
      text-align: center;
      color: #4b5563;
      margin-bottom: 0.6rem;
      font-size: 0.9rem;
    }

    .task-line {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
    }
    .quot-input {
      width: 2.0rem;
      height: 2.0rem;
      border-radius: 8px;
      border: 2px solid #d1d5db;
      font-size: 1.1rem;
      text-align: center;
      background: #f9fafb;
      cursor: pointer;
      margin-left: 0.1rem;
    }
    .quot-input.correct {
      border-color: #16a34a;
      background: #dcfce7;
    }
    .quot-input.incorrect {
      border-color: #b91c1c;
      background: #fee2e2;
    }

    /* Gitter wie kariertes Papier, 3 Spalten für H, Z, E */
    .grid-wrapper {
      display: inline-block;
      margin: 0 auto 0.8rem auto;
      border: 1px solid #e5e7eb;
      padding: 0.15rem;
      background: #f9fafb;
    }
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(3, 2.3rem);
      grid-auto-rows: 2.1rem;
      gap: 0;
    }
    .grid-cell {
      border: 1px solid #e5e7eb; /* kariertes Papier */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .work-input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 1.05rem;
      cursor: pointer;
    }
    .work-input:focus {
      outline: none;
    }

    .buttons-row {
      margin-top: 0.6rem;
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn:hover {
      background: #e5e7eb;
      border-color: #9ca3af;
    }

    .feedback {
      text-align: center;
      margin-top: 0.5rem;
      min-height: 1.2rem;
      font-weight: 500;
      font-size: 0.95rem;
    }
    .feedback.ok { color: #15803d; }
    .feedback.error { color: #b91c1c; }

    /* Popup */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .popup {
      background: #ffffff;
      border-radius: 14px;
      padding: 0.8rem 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      max-width: 260px;
      width: 100%;
    }
    .popup-title {
      text-align: center;
      font-weight: 600;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }
    .digit-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap: 0.3rem;
      margin-bottom: 0.4rem;
    }
    .digit-btn {
      padding: 0.3rem 0;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-size: 1.05rem;
      cursor: pointer;
    }
    .digit-btn:hover { background: #e5e7eb; }
    .popup-footer {
      text-align: center;
    }
    .popup-close {
      padding: 0.25rem 0.8rem;
      border-radius: 999px;
      border: none;
      background: #e5e7eb;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .popup-close:hover { background: #d1d5db; }
  </style>
</head>
<body>
<div class="app">
  <h1>Schriftliche Division</h1>
  <div class="subtitle">Bis 1.000 – einstelliger Divisor, ohne Rest</div>

  <!-- Aufgabenzeile -->
  <div class="task-line" id="task-line">
    <!-- Wird per JS gefüllt, z.B.: 432 : 3 = [ ][ ][ ] -->
  </div>

  <!-- Gitter für die Rechenschritte, 3 Spalten (H, Z, E) × 6 Zeilen -->
  <div class="grid-wrapper">
    <div class="calc-grid">
      <!-- 6 Zeilen × 3 Spalten, alles Eingabefelder -->
      <!-- Zeile 1 -->
      <div class="grid-cell"><input class="work-input" data-row="0" data-col="0" readonly></div>
      <div class="grid-cell"><input class="work-input" data-row="0" data-col="1" readonly></div>
      <div class="grid-cell"><input class="work-input" data-row="0" data-col="2" readonly></div>
      <!-- Zeile 2 -->
      <div class="grid-cell"><input class="work-input" data-row="1" data-col="0" readonly></div>
      <div class="grid-cell"><input class="work-input" data-row="1" data-col="1" readonly></div>
      <div class="grid-cell"><input class="work-input" data-row="1" data-col="2" readonly></div>
      <!-- Zeile 3 -->
      <div class="grid-cell"><input class="work-input" data-row="2" data-col="0" readonly></div>
      <div class="grid-cell"><input class="work-input" data-row="2" data-col="1" readonly></div>
      <div class="grid-cell"><input class="work-input" data-row="2" data-col="2" readonly></div>
      <!-- Zeile 4 -->
      <div class="grid-cell"><input class="work-input" data-row="3" data-col="0" readonly></div>
      <div class="grid-cell"><input class="work-input" data-row="3" data-col="1" readonly></div>
      <div class="grid-cell"><input class="work-input" data-row="3" data-col="2" readonly></div>
      <!-- Zeile 5 -->
      <div class="grid-cell"><input class="work-input" data-row="4" data-col="0" readonly></div>
      <div class="grid-cell"><input class="work-input" data-row="4" data-col="1" readonly></div>
      <div class="grid-cell"><input class="work-input" data-row="4" data-col="2" readonly></div>
      <!-- Zeile 6 -->
      <div class="grid-cell"><input class="work-input" data-row="5" data-col="0" readonly></div>
      <div class="grid-cell"><input class="work-input" data-row="5" data-col="1" readonly></div>
      <div class="grid-cell"><input class="work-input" data-row="5" data-col="2" readonly></div>
    </div>
  </div>

  <div class="buttons-row">
    <button class="btn" id="new-btn">Neue Aufgabe</button>
    <button class="btn" id="check-btn">Überprüfen</button>
  </div>

  <div class="feedback" id="feedback"></div>
</div>

<!-- Popup für Ziffernauswahl -->
<div class="popup-overlay" id="popup-overlay">
  <div class="popup">
    <div class="popup-title">Ziffer auswählen</div>
    <div class="digit-grid" id="digit-grid"></div>
    <div class="popup-footer">
      <button class="popup-close" id="popup-close-btn">Abbrechen</button>
    </div>
  </div>
</div>

<script>
  const NUM_QUOT_DIGITS = 3; // Quotient bis 3-stellig (z.B. 144)
  let divisor  = 0;
  let dividend = 0;
  let quotient = 0;
  let quotientDigits = [];

  let activeInput = null;

  const taskLine   = document.getElementById('task-line');
  const feedbackEl = document.getElementById('feedback');

  const popupOverlay  = document.getElementById('popup-overlay');
  const digitGrid     = document.getElementById('digit-grid');
  const popupCloseBtn = document.getElementById('popup-close-btn');

  const newBtn   = document.getElementById('new-btn');
  const checkBtn = document.getElementById('check-btn');

  let quotInputs = [];  // wird beim Generieren neu aufgebaut
  const workInputs = Array.from(document.querySelectorAll('.work-input'));

  /* Hilfsfunktionen */

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function digitsOf(num, len) {
    const arr = new Array(len).fill(0);
    let n = Math.floor(Math.abs(num));
    for (let i = len - 1; i >= 0; i--) {
      arr[i] = n % 10;
      n = Math.floor(n / 10);
    }
    return arr;
  }

  function resetInputs() {
    quotInputs.forEach(inp => {
      inp.value = '';
      inp.classList.remove('correct', 'incorrect');
    });
    workInputs.forEach(inp => {
      inp.value = '';
    });
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
  }

  /* Popup */

  function buildDigitButtons() {
    digitGrid.innerHTML = '';
    for (let d = 0; d <= 9; d++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'digit-btn';
      btn.textContent = String(d);
      btn.addEventListener('click', () => {
        if (activeInput) activeInput.value = String(d);
        hidePopup();
      });
      digitGrid.appendChild(btn);
    }
  }

  function showPopupForInput(inputEl) {
    activeInput = inputEl;
    popupOverlay.style.display = 'flex';
  }

  function hidePopup() {
    popupOverlay.style.display = 'none';
    activeInput = null;
  }

  popupCloseBtn.addEventListener('click', hidePopup);
  popupOverlay.addEventListener('click', (e) => {
    if (e.target === popupOverlay) hidePopup();
  });

  function attachInputClicks() {
    const all = [...quotInputs, ...workInputs];
    all.forEach(inp => {
      inp.addEventListener('click', () => {
        inp.classList.remove('correct', 'incorrect');
        showPopupForInput(inp);
      });
    });
  }

  /* Aufgaben-Generierung */

  function generateProblem() {
    // Einstelliger Divisor, Dividend dreistellig, ohne Rest
    divisor = randomInt(2, 9);

    // Quotient 2–3-stellig, so dass Dividend ≤ 999
    let qMin = 2;
    let qMax = Math.floor(999 / divisor);
    if (qMax < qMin) qMax = qMin;
    quotient = randomInt(qMin, qMax);
    dividend = divisor * quotient;

    quotientDigits = digitsOf(quotient, NUM_QUOT_DIGITS);

    // Aufgabenzeile aufbauen: 432 : 3 = [ ][ ][ ]
    taskLine.innerHTML = '';
    const spanDiv = document.createElement('span');
    spanDiv.textContent = dividend + ' : ' + divisor + ' = ';
    taskLine.appendChild(spanDiv);

    quotInputs = [];
    for (let i = 0; i < NUM_QUOT_DIGITS; i++) {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.maxLength = 1;
      inp.className = 'quot-input';
      inp.setAttribute('data-col', i);
      taskLine.appendChild(inp);
      quotInputs.push(inp);
    }

    resetInputs();
    attachInputClicks();
  }

  /* Lösung prüfen – Quotient */

  function checkSolution() {
    let allCorrect = true;

    quotInputs.forEach(inp => {
      const col = parseInt(inp.getAttribute('data-col'), 10);
      const expected = quotientDigits[col];
      const value = inp.value === '' ? 0 : parseInt(inp.value, 10);
      inp.classList.remove('correct', 'incorrect');
      if (value === expected) {
        inp.classList.add('correct');
      } else {
        inp.classList.add('incorrect');
        allCorrect = false;
      }
    });

    if (allCorrect) {
      feedbackEl.textContent = 'Super, alles korrekt gelöst! 🎉';
      feedbackEl.className = 'feedback ok';
    } else {
      feedbackEl.textContent = 'Der Quotient stimmt noch nicht ganz. Kontrolliere deine Rechnung im Gitter.';
      feedbackEl.className = 'feedback error';
    }
  }

  newBtn.addEventListener('click', generateProblem);
  checkBtn.addEventListener('click', checkSolution);

  buildDigitButtons();
  generateProblem();
</script>
</body>
</html>
