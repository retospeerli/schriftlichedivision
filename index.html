<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Schriftliche Division bis 1.000 – einstellig</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI";
      background: #f3f4f6;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 2rem 2.5rem;
      max-width: 520px;
      width: 100%;
      box-sizing: border-box;
    }
    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 1.4rem;
    }
    .subtitle {
      text-align: center;
      color: #4b5563;
      margin-bottom: 0.8rem;
      font-size: 0.9rem;
    }

    .task-info {
      text-align: center;
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
    }

    .layout {
      display: grid;
      grid-template-columns: auto repeat(4, 2.6rem);
      gap: 0.12rem;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.8rem;
    }

    .label-cell {
      text-align: right;
      padding-right: 0.4rem;
      font-size: 1.3rem;
      color: #111827;
      min-height: 2rem;
    }

    .digit-cell {
      text-align: center;
      font-size: 1.2rem;
      min-height: 2rem;
    }

    .dividend-digit {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .input-digit {
      width: 2.3rem;
      height: 2.3rem;
      border-radius: 8px;
      border: 2px solid #d1d5db;
      font-size: 1.1rem;
      background: #f9fafb;
      cursor: pointer;
      text-align: center;
    }
    .input-digit.correct {
      border-color: #16a34a;
      background: #dcfce7;
    }
    .input-digit.incorrect {
      border-color: #b91c1c;
      background: #fee2e2;
    }

    .line-row {
      grid-column: 2 / span 4;
      border-bottom: 2px solid #111827;
      margin: 0.1rem 0 0.25rem 0;
    }

    .buttons-row {
      margin-top: 0.4rem;
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn:hover {
      background: #e5e7eb;
      border-color: #9ca3af;
    }

    .feedback {
      text-align: center;
      margin-top: 0.5rem;
      min-height: 1.2rem;
      font-weight: 500;
      font-size: 0.95rem;
    }
    .feedback.ok { color: #15803d; }
    .feedback.error { color: #b91c1c; }

    /* Popup */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .popup {
      background: #ffffff;
      border-radius: 14px;
      padding: 0.8rem 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      max-width: 260px;
      width: 100%;
    }
    .popup-title {
      text-align: center;
      font-weight: 600;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }
    .digit-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap: 0.3rem;
      margin-bottom: 0.4rem;
    }
    .digit-btn {
      padding: 0.3rem 0;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-size: 1.05rem;
      cursor: pointer;
    }
    .digit-btn:hover {
      background: #e5e7eb;
    }
    .popup-footer {
      text-align: center;
    }
    .popup-close {
      padding: 0.25rem 0.8rem;
      border-radius: 999px;
      border: none;
      background: #e5e7eb;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .popup-close:hover {
      background: #d1d5db;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Schriftliche Division</h1>
  <div class="subtitle">Bis 1.000 – einstelliger Divisor, ohne Rest</div>

  <div class="task-info" id="task-info"></div>

  <div class="layout">
    <!-- Zeile 1: Divisor links, Quotient oben in Kästchen -->
    <div class="label-cell" id="divisor-cell"></div>
    <div class="digit-cell"><input class="input-digit q" data-col="0" readonly></div>
    <div class="digit-cell"><input class="input-digit q" data-col="1" readonly></div>
    <div class="digit-cell"><input class="input-digit q" data-col="2" readonly></div>
    <div class="digit-cell"><input class="input-digit q" data-col="3" readonly></div>

    <!-- Trennlinie über dem Dividend (wie Divisionsklammer) -->
    <div></div>
    <div class="line-row"></div>

    <!-- Zeile 3: Dividend rechtsbündig in den Spalten -->
    <div></div>
    <div class="digit-cell dividend-digit" id="d0"></div>
    <div class="digit-cell dividend-digit" id="d1"></div>
    <div class="digit-cell dividend-digit" id="d2"></div>
    <div class="digit-cell dividend-digit" id="d3"></div>
  </div>

  <div class="buttons-row">
    <button class="btn" id="new-btn">Neue Aufgabe</button>
    <button class="btn" id="check-btn">Überprüfen</button>
  </div>

  <div class="feedback" id="feedback"></div>
</div>

<!-- Popup für Ziffernauswahl -->
<div class="popup-overlay" id="popup-overlay">
  <div class="popup">
    <div class="popup-title">Ziffer auswählen</div>
    <div class="digit-grid" id="digit-grid"></div>
    <div class="popup-footer">
      <button class="popup-close" id="popup-close-btn">Abbrechen</button>
    </div>
  </div>
</div>

<script>
  const NUM_COLS = 4; // bis 4 Ziffern (max. 1000)

  let divisor = 0;
  let dividend = 0;
  let quotient = 0;
  let quotientDigits = [];

  let activeInput = null;

  const taskInfo     = document.getElementById('task-info');
  const divisorCell  = document.getElementById('divisor-cell');
  const dividendSpans = [
    document.getElementById('d0'),
    document.getElementById('d1'),
    document.getElementById('d2'),
    document.getElementById('d3')
  ];

  const qInputs   = Array.from(document.querySelectorAll('.q'));
  const newBtn    = document.getElementById('new-btn');
  const checkBtn  = document.getElementById('check-btn');
  const feedback  = document.getElementById('feedback');

  const popupOverlay  = document.getElementById('popup-overlay');
  const digitGrid     = document.getElementById('digit-grid');
  const popupCloseBtn = document.getElementById('popup-close-btn');

  /* Hilfsfunktionen */

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function digitsOf(num, cols) {
    const arr = new Array(cols).fill(0);
    let n = Math.floor(Math.abs(num));
    for (let i = cols - 1; i >= 0; i--) {
      arr[i] = n % 10;
      n = Math.floor(n / 10);
    }
    return arr;
  }

  function digitsCount(num) {
    if (num === 0) return 1;
    let n = Math.floor(Math.abs(num));
    let c = 0;
    while (n > 0) { n = Math.floor(n / 10); c++; }
    return c;
  }

  function resetInputs() {
    qInputs.forEach(inp => {
      inp.value = '';
      inp.classList.remove('correct', 'incorrect');
    });
    feedback.textContent = '';
    feedback.className = 'feedback';
  }

  /* Popup */

  function buildDigitButtons() {
    digitGrid.innerHTML = '';
    for (let d = 0; d <= 9; d++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'digit-btn';
      btn.textContent = String(d);
      btn.addEventListener('click', () => {
        if (activeInput) activeInput.value = String(d);
        hidePopup();
      });
      digitGrid.appendChild(btn);
    }
  }

  function showPopupForInput(inputEl) {
    activeInput = inputEl;
    popupOverlay.style.display = 'flex';
  }

  function hidePopup() {
    popupOverlay.style.display = 'none';
    activeInput = null;
  }

  popupCloseBtn.addEventListener('click', hidePopup);
  popupOverlay.addEventListener('click', (e) => {
    if (e.target === popupOverlay) hidePopup();
  });

  function setupInputClicks() {
    qInputs.forEach(inp => {
      inp.addEventListener('click', () => {
        inp.classList.remove('correct', 'incorrect');
        showPopupForInput(inp);
      });
    });
  }

  /* Aufgaben-Generierung */

  function generateProblem() {
    // Divisor 2–9, Quotient so wählen, dass Dividend ≤ 1000 und mind. zweistellig
    divisor = randomInt(2, 9);

    let qMin = 2;
    let qMax = Math.floor(1000 / divisor);
    if (qMax < qMin) qMax = qMin;
    quotient = randomInt(qMin, qMax);
    dividend = divisor * quotient;

    quotientDigits = digitsOf(quotient, NUM_COLS);
    const dividendDigits = digitsOf(dividend, NUM_COLS);

    taskInfo.textContent = "Teile " + dividend + " durch " + divisor + ".";
    divisorCell.textContent = divisor + " )";

    // Dividend rechtsbündig anzeigen (führende Nullen unterdrücken)
    const len = digitsCount(dividend);
    for (let i = 0; i < NUM_COLS; i++) {
      const isLeadingZero = (i < NUM_COLS - len) && dividendDigits[i] === 0;
      dividendSpans[i].textContent = isLeadingZero ? "" : dividendDigits[i];
    }

    resetInputs();
  }

  /* Lösung prüfen */

  function checkSolution() {
    let allCorrect = true;

    // Eingaben zu einer Zahl zusammensetzen
    const enteredDigits = qInputs.map(inp => {
      return inp.value === '' ? 0 : parseInt(inp.value, 10);
    });

    // führende Nullen ignorieren
    let expectedStr = quotient.toString();
    let enteredStr  = enteredDigits.join('');
    enteredStr = enteredStr.replace(/^0+/, '');
    if (enteredStr === '') enteredStr = '0';

    qInputs.forEach((inp, index) => {
      const expectedDigit = quotientDigits[index];
      const enteredDigit = inp.value === '' ? 0 : parseInt(inp.value, 10);
      inp.classList.remove('correct', 'incorrect');

      if (expectedDigit === enteredDigit) {
        inp.classList.add('correct');
      } else {
        inp.classList.add('incorrect');
        allCorrect = false;
      }
    });

    if (enteredStr !== expectedStr) {
      allCorrect = false;
    }

    if (allCorrect) {
      feedback.textContent = 'Super, alles korrekt gelöst! 🎉';
      feedback.className = 'feedback ok';
    } else {
      feedback.textContent = 'Noch nicht ganz richtig. Überprüfe deine Ziffern im Quotienten.';
      feedback.className = 'feedback error';
    }
  }

  /* Events */

  const newBtn = document.getElementById('new-btn');
  const checkBtn = document.getElementById('check-btn');

  newBtn.addEventListener('click', generateProblem);
  checkBtn.addEventListener('click', checkSolution);

  buildDigitButtons();
  setupInputClicks();
  generateProblem();
</script>
</body>
</html>
